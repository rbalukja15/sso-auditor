name: Bug
description: The tool crashed, hung, or behaved differently from its docs.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the output. Remove secrets and private hostnames.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sso-auditor version
      description: Output of `sso-auditor --version`
    validations:
      required: true
