version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      runtime:
        dependency-type: production
        patterns: ["*"]
      dev-tools:
        dependency-type: development
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
