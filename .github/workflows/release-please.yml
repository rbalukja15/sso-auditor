name: release-please

# Opens and updates a release PR from the Conventional Commits on main. Merging
# that PR tags the release and writes CHANGELOG.md. Publishing comes with #23.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create release tags and update CHANGELOG.md
      pull-requests: write # open and update the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
