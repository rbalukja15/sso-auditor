[project]
name = "sso-auditor"
dynamic = ["version"]
description = "Read-only OIDC/OAuth configuration auditor: spec-cited findings from discovery and JWKS."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Romarjo Balukja" }]
keywords = ["oidc", "oauth", "keycloak", "security", "audit"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["sso-auditor-core", "typer>=0.27.3"]

[project.scripts]
sso-auditor = "sso_auditor_cli.main:app"

[project.urls]
Repository = "https://github.com/rbalukja15/sso-auditor"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sso_auditor_cli"]

[tool.hatch.version]
path = "src/sso_auditor_cli/__init__.py"

[tool.uv]
# Rebuild the editable install when the version line changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/sso_auditor_cli/__init__.py" }]
