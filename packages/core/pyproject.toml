[project]
name = "sso-auditor-core"
dynamic = ["version"]
description = "Core library for sso-auditor: ingestion, safe fetcher, rules and report model."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Romarjo Balukja" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "certifi>=2026.10.19",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
]

[project.urls]
Repository = "https://github.com/rbalukja15/sso-auditor"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sso_auditor_core"]

[tool.hatch.version]
path = "src/sso_auditor_core/__init__.py"

[tool.uv]
# Rebuild the editable install when the version line changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/sso_auditor_core/__init__.py" }]
