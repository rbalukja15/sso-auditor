[project]
name = "sso-auditor-api"
dynamic = ["version"]
description = "HTTP API for the sso-auditor hosted demo (discovery-only)."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Romarjo Balukja" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["fastapi>=0.159.1", "sso-auditor-core", "uvicorn>=0.54.0"]

[project.urls]
Repository = "https://github.com/rbalukja15/sso-auditor"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sso_auditor_api"]

[tool.hatch.version]
path = "src/sso_auditor_api/__init__.py"

[tool.uv]
# Rebuild the editable install when the version line changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/sso_auditor_api/__init__.py" }]
